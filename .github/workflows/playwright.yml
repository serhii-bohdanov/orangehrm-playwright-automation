name: Playwright UI Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# top-level permissions: required for deploy-pages + writing summary
permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  checks: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm test
        env:
          CI: true
          MAIN_USER_USERNAME: ${{ secrets.MAIN_USER_USERNAME }}
          MAIN_USER_PASSWORD: ${{ secrets.MAIN_USER_PASSWORD }}
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright Report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Upload the generated HTML directory as a Pages artifact (official flow)
      - name: Upload Pages artifact (Allure)
        if: always()
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./allure-report

      # Deploy the uploaded artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        if: always()
        id: deploy-pages
        uses: actions/deploy-pages@v1

      # Add the Pages URL (or fallback to artifact) to the job summary for convenience
      - name: Add Allure Report Link to Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const { owner, repo } = context.repo;
            try {
              const res = await github.rest.repos.getPages({ owner, repo });
              const url = res.data.html_url;
              core.summary
                .addHeading('📊 Test Reports Available')
                .addLink('🏠 Hosted Allure Report', url)
                .addBreak()
                .addLink('📈 Download Allure Report (artifact)', `https://github.com/${owner}/${repo}/suites/${runId}/artifacts`)
                .addBreak()
                .addLink('🎭 Download Playwright Report (artifact)', `https://github.com/${owner}/${repo}/suites/${runId}/artifacts`)
                .write();
            } catch (err) {
              core.warning('Pages URL not available yet — falling back to artifact links.');
              core.summary
                .addHeading('📊 Test Reports Available')
                .addLink('📈 Download Allure Report (artifact)', `https://github.com/${owner}/${repo}/suites/${runId}/artifacts`)
                .addBreak()
                .addLink('🎭 Download Playwright Report (artifact)', `https://github.com/${owner}/${repo}/suites/${runId}/artifacts`)
                .write();
            }
