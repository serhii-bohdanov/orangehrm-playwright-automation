name: Playwright UI Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# top-level permissions: required for Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  checks: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm test
        env:
          CI: true
          MAIN_USER_USERNAME: ${{ secrets.MAIN_USER_USERNAME }}
          MAIN_USER_PASSWORD: ${{ secrets.MAIN_USER_PASSWORD }}
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright Report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Deploy Allure Report to GitHub Pages using gh-pages branch
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          cname: # Remove this line if you don't have a custom domain
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      # Add report links to job summary
      - name: Add Report Links to Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const { owner, repo } = context.repo;
            const allureUrl = `https://${owner}.github.io/${repo}`;
            const artifactUrl = `https://github.com/${owner}/${repo}/suites/${runId}/artifacts`;
            
            core.summary
              .addHeading('📊 Test Reports Available')
              .addBreak()
              .addLink('🏠 View Allure Report (Public)', allureUrl)
              .addBreak()
              .addLink('📈 Download Allure Report (Artifact)', artifactUrl)
              .addBreak()
              .addLink('🎭 Download Playwright Report (Artifact)', artifactUrl)
              .addBreak()
              .write();
              
            core.notice(`Allure Report: ${allureUrl}`);
