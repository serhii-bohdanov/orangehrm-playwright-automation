name: Playwright UI Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    timeout-minutes: 60

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm test
        env:
          CI: true
          MAIN_USER_USERNAME: ${{ secrets.MAIN_USER_USERNAME }}
          MAIN_USER_PASSWORD: ${{ secrets.MAIN_USER_PASSWORD }}
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Run Allure GitHub Action
        if: always()
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./allure-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sections: |
            new
            flaky
            retry

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Add Allure Report Link to Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            core.summary
              .addHeading('📊 Test Reports Available')
              .addLink('📈 Download Allure Report', artifactUrl)
              .addBreak()
              .addLink('🎭 Download Playwright Report', artifactUrl)
              .write();
