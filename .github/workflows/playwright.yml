name: Run Automation Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Select test suite'
        required: true
        default: UI
        type: choice
        options:
          - UI
          - API

  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        if: ${{ inputs.suite == 'UI' || inputs.suite == '' }}
        run: npx playwright test tests/ui
        env:
          CI: true
          MAIN_USER_USERNAME: ${{ secrets.MAIN_USER_USERNAME }}
          MAIN_USER_PASSWORD: ${{ secrets.MAIN_USER_PASSWORD }}
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Run API tests
        if: ${{ inputs.suite == 'API' }}
        run: npx playwright test tests/api
        env:
          CI: true
          MAIN_USER_USERNAME: ${{ secrets.MAIN_USER_USERNAME }}
          MAIN_USER_PASSWORD: ${{ secrets.MAIN_USER_PASSWORD }}
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Generate Allure Report
        if: ${{ always() }}
        run: npm run allure:generate

      - name: Upload Allure Report Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright Report Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Deploy to GitHub Pages
        if: ${{ always() }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Add Report Links to Summary
        if: ${{ always() }}
        run: |
          echo "## 📊 Test Report Available" >> $GITHUB_STEP_SUMMARY
          echo "🏠 **[Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }})**" >> $GITHUB_STEP_SUMMARY